name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test
        run: go test -mod=mod ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -mod=mod ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install frontend dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Speech service tests
        run: npm run test:speech
      - name: Static frontend checks
        run: npm run check:frontend
      - name: Typecheck frontend source
        run: npm run typecheck
      - name: Build frontend source
        run: npm run build
